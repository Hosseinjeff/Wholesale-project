[supervisord]
nodaemon=true
user=root
logfile=/dev/null
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

# The durable pipeline worker runs inside the web process to avoid a second Python runtime.
[program:web]
command=/usr/local/bin/gunicorn app:app --bind 0.0.0.0:%(ENV_PORT)s --workers 1 --threads 2 --timeout 900 --graceful-timeout 20
user=app
directory=/app
autostart=true
autorestart=unexpected
startsecs=3
startretries=3
stopsignal=TERM
stopwaitsecs=25
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
