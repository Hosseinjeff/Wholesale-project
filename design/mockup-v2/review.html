<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>MolaviSale · Mockup v2</title><style>*{box-sizing:border-box}body{margin:0;background:#f0f1f3;color:#243239;font:14px system-ui,sans-serif}header{background:#fff;border-bottom:1px solid #dce0e4;padding:14px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}h1{font-size:16px;margin:0}p{font-size:12px;color:#6a747c;margin:5px 0 0}.controls{display:flex;gap:7px;align-items:center;margin-left:auto;flex-wrap:wrap}button,a{font:inherit;font-size:12px;text-decoration:none;border:1px solid #dfe3e6;color:#48565e;background:white;padding:9px 12px;border-radius:7px;cursor:pointer}button[aria-pressed=true]{background:#d94419;border-color:#d94419;color:#fff}main{padding:25px 16px 35px;display:flex;justify-content:center;align-items:flex-start}.frame{background:white;border:1px solid #dce0e4;box-shadow:0 8px 28px #22334409;overflow:hidden}iframe{display:block;border:0;background:#fff}.desktop .frame{width:1440px;max-width:100%;height:1000px}.desktop iframe{width:100%;height:100%}.mobile .frame{width:414px;padding:10px;border-radius:35px;background:#243239}.mobile iframe{width:390px;height:844px;border-radius:26px}.note{text-align:center;color:#6a747c;font-size:11px;padding:0 16px 22px}button:focus-visible,a:focus-visible{outline:3px solid #08766b;outline-offset:3px}@media(max-width:650px){header{padding:14px 16px;gap:12px}.controls{margin:0}main{padding:16px 0}.mobile .frame{border:0;background:none;padding:0;width:100%;border-radius:0}.mobile iframe{width:100%;height:calc(100dvh - 155px);min-height:600px;border-radius:0}.desktop .frame{height:calc(100dvh - 155px)}.note{font-size:10px}}@media(min-width:651px){.mobile .frame{flex-shrink:0}}</style></head><body><header><div><h1>MolaviSale · Mockup v2</h1><p>Orange · Raspberry · Teal / Illustrative products and prices</p></div><nav class="controls" aria-label="Preview mode"><button id="desktop" aria-pressed="true">Desktop</button><button id="mobile" aria-pressed="false">Phone</button><a href="storefront.html" target="_blank" rel="noopener">Open interactive mockup ↗</a><a href="business-flow.md" target="_blank">Business flow</a><a href="design-decisions.md" target="_blank">Design notes</a></nav></header><main id="stage" class="desktop"><div class="frame"><iframe title="Interactive Persian storefront mockup" src="storefront.html"></iframe></div></main><p class="note">Try + / −: current discounts and basket totals change together. Pink = maximum discount; teal = current discount. No real orders or payments.</p><script>const stage=document.getElementById('stage');function mode(value){stage.className=value;document.getElementById('desktop').setAttribute('aria-pressed',value==='desktop');document.getElementById('mobile').setAttribute('aria-pressed',value==='mobile');history.replaceState(null,'','?view='+value)}document.getElementById('desktop').onclick=()=>mode('desktop');document.getElementById('mobile').onclick=()=>mode('mobile');mode(new URLSearchParams(location.search).get('view')==='mobile'?'mobile':'desktop');</script></body></html>
